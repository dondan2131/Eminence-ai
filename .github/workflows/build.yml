name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = The Eminence AI
          package.name = eminenceai
          package.domain = org.eminence
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy==2.3.0,plyer,pyjnius,certifi,openssl
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.ndk_api = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          set +e
          timeout 75m buildozer android debug > build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            n=$(grep -n "Command failed" build.log | head -n 1 | cut -d: -f1)
            total=$(wc -l < build.log)
            [ -z "$n" ] && n=$total
            s=$((n-80))
            [ "$s" -lt 1 ] && s=1
            echo "=== PRZED BLEDEM (linia $n z $total) ==="
            sed -n "${s},${n}p" build.log | cut -c1-220
            echo "=== SZCZEGOLY ==="
            grep -n -E "FAILURE|What went wrong|BUILD FAILED|Traceback|aidl|No such file|Exception" build.log | tail -n 15 | cut -c1-220
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eminence-ai-apk
          path: bin/*.apk
