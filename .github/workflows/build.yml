name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        shell: bash
        run: |
          buildozer android debug > build.log 2>&1 || { echo "=== OSTATNIE LINIE ==="; tail -n 40 build.log; echo "=== BLEDY ==="; grep -n -i -E "error|failed|not found" build.log | tail -n 15; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: eminence-ai-apk
          path: bin/*.apk
