name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = The Eminence AI
          package.name = eminenceai
          package.domain = org.eminence
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 0.1
          requirements = python3,kivy==2.3.0,plyer,pyjnius,certifi,openssl
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.ndk_api = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          buildozer android debug > build.log 2>&1 || { echo "=== OSTATNIE LINIE ==="; tail -n 40 build.log; echo "=== BLEDY ==="; grep -n -i -E "error|failed|not found" build.log | tail -n 15; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: eminence-ai-apk
          path: bin/*.apk
